steps:
  - name: Generate stats
    image: python
    secrets: [ access_token, user, git_url ]
    environment:
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - USER=${USER}
      - GIT_URL=${GIT_URL}
    commands:
      - python -m venv venv
      - /bin/bash -c "source venv/bin/activate"
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt
      - python3 main.py
  - name: Commit to the repo
    image: appleboy/drone-git-push
    settings:
      remote_name: origin
      branch: main
      local_ref: main
    commands:
    - git config --global user.name "[CI] Update stats"