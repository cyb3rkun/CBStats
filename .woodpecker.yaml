steps:
  - name: Install requirements
    image: python
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt
  - name: Generate stats
    image: python
    secrets: [ access_token, user, git_url ]
    environment:
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - USER=${USER}
      - GIT_URL=${GIT_URL}
    commands:
      - python3 main.py
